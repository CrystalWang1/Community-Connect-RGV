<!doctype html>
<html><body><script>
const send = (type, data = {}) => parent.postMessage({isStreamlitMessage: true, type, ...data}, location.origin);
let lastResult;
window.addEventListener('message', event => {
  if (event.source !== parent || event.origin !== location.origin || event.data.type !== 'streamlit:render') return;
  const {command, cookie_name} = event.data.args;
  let result;
  try {
    const read = () => {
      const item = document.cookie.split('; ').find(value => value.startsWith(cookie_name + '='));
      return item ? decodeURIComponent(item.slice(cookie_name.length + 1)) : null;
    };
    const flags = '; Path=/; SameSite=Strict' + (location.protocol === 'https:' ? '; Secure' : '');
    if (command.action === 'set') {
      document.cookie = cookie_name + '=' + encodeURIComponent(command.token) + '; Max-Age=' + command.max_age + flags;
      if (read() !== command.token) throw new Error('Cookie was blocked');
    } else if (command.action === 'clear') {
      document.cookie = cookie_name + '=; Max-Age=0' + flags;
      if (read() !== null) throw new Error('Cookie could not be cleared');
    }
    result = {request_id: command.id, token: read(), error: false};
  } catch (_) {
    result = {request_id: command.id, token: null, error: true};
  }
  const serialized = JSON.stringify(result);
  if (serialized !== lastResult) {
    lastResult = serialized;
    send('streamlit:setComponentValue', {value: result, dataType: 'json'});
  }
  send('streamlit:setFrameHeight', {height: 0});
});
send('streamlit:componentReady', {apiVersion: 1});
</script></body></html>
